[project]
name = "geryon"
version = "0.1.0"
description = "Measuring prompt-injection defences on the attacks that wear an authorised face"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "agentdojo",
  "pyyaml",
  "jsonschema",
]

[project.optional-dependencies]
# The corpus and the statistics can be checked without a benchmark or a GPU.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
geryon-overlap = "geryon.overlap:main"
geryon-validate = "geryon.cases:main"
geryon-stats = "geryon.stats:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
