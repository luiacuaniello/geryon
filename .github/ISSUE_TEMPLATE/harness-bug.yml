name: Bug in the harness
description: Something in the code does not do what it says
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output. Logs live in results/<run>/.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or tag
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >-
        Python version, operating system, and whether the defence was active.
        If you used a model other than the ones in docs/running-progent.md, say
        which.
    validations:
      required: true
